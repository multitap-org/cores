# Builds every core in the matrix for each platform with the same toolchains
# as piccolo's builds, smoke-tests it (scripts/smoke.sh) and uploads dist/:
# the cores, their SHA-256 and the exact source. On main (and by hand), when
# every build passed, the "release" job makes a GitHub Release from them
# (scripts/make-release.sh: zips + manifest.cfg); the server's publisher pulls
# the latest release, signs the indexes and serves them.
name: Build cores

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: ${{ matrix.core }} (Linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        core: [sameboy, gambatte, mgba, bsnes, snes9x, supafaust, genesis-plus-gx, beetle-pce, beetle-psx, beetle-saturn, beetle-wswan, beetle-ngp, beetle-vb, dosbox-pure]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The image piccolo's Flatpak is built with: the freedesktop 25.08 SDK.
    # Cores built in it match the runtime piccolo's Flatpak runs on.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and smoke-test inside the SDK
        run: |
          git config --global --add safe.directory '*'
          # The checkout belongs to the runner's user; inside flatpak's sandbox
          # root has no capabilities left to write to it.
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          flatpak run --share=network --filesystem="$GITHUB_WORKSPACE" --filesystem=home \
            --command=sh org.freedesktop.Sdk//25.08 -c \
            "cd '$GITHUB_WORKSPACE' && scripts/build-core.sh ${{ matrix.core }} linux && scripts/smoke.sh ${{ matrix.core }} linux"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.core }}-linux-${{ matrix.arch }}
          path: dist/

  windows:
    name: ${{ matrix.core }} (Windows x86_64)
    strategy:
      fail-fast: false
      matrix:
        core: [sameboy, gambatte, mgba, bsnes, snes9x, supafaust, genesis-plus-gx, beetle-pce, beetle-psx, beetle-saturn, beetle-wswan, beetle-ngp, beetle-vb, dosbox-pure]
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - run: git config --global core.autocrlf false
        shell: pwsh

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # piccolo's Windows toolchain (UCRT64 GCC), plus what the cores' build
      # tools need (make, hexdump, bison + libpng for rgbds), python for the
      # SNES smoke ROM.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            util-linux
            bison
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-python

      - name: Build
        run: scripts/build-core.sh ${{ matrix.core }} windows

      # The core must only need Windows' own DLLs.
      - name: Check DLL dependencies
        run: |
          objdump -p dist/windows/*.dll | grep 'DLL Name' | tee dlls.txt
          if grep -iE 'libstdc|libgcc|libwinpthread' dlls.txt; then
            echo "the core depends on MSYS2 DLLs"
            exit 1
          fi

      - name: Smoke test
        run: scripts/smoke.sh ${{ matrix.core }} windows

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.core }}-windows-x86_64
          path: dist/

  android:
    name: ${{ matrix.core }} (Android arm64-v8a)
    strategy:
      fail-fast: false
      matrix:
        core: [sameboy, gambatte, mgba, bsnes, snes9x, supafaust, genesis-plus-gx, beetle-pce, beetle-psx, beetle-saturn, beetle-wswan, beetle-ngp, beetle-vb, dosbox-pure]
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: r30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison libpng-dev bsdextrautils

      # The NDK piccolo's Android build uses (on x86_64 its own clang runs;
      # on Andrés's arm64 machine a distro clang with its sysroot).
      - uses: actions/cache@v4
        id: ndk
        with:
          path: ~/ndk
          key: ndk-${{ env.NDK_VERSION }}
      - name: NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ndk
          curl -sSLo ndk.zip "https://dl.google.com/android/repository/android-ndk-$NDK_VERSION-linux.zip"
          unzip -q ndk.zip -d ~/ndk
          rm ndk.zip

      - name: Build
        run: ANDROID_NDK_ROOT=~/ndk/android-ndk-$NDK_VERSION scripts/build-core.sh ${{ matrix.core }} android

      - name: Check (arm64, 16 KB pages)
        run: scripts/smoke.sh ${{ matrix.core }} android

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.core }}-android-arm64-v8a
          path: dist/

  # The web: static archives piccolo's browser build links in (its web/build-core.sh
  # runs scripts/build-core.sh <core> web from its deps/cores). Built here so a
  # core that stops building for the web shows up in this repo first. Not in
  # the release: piccolo builds them itself, with the emsdk it pins.
  web:
    name: ${{ matrix.core }} (web)
    strategy:
      fail-fast: false
      matrix:
        core: [sameboy, snes9x]
    runs-on: ubuntu-24.04
    env:
      EMSDK_VERSION: 6.0.13   # piccolo's web build (.github/workflows/web.yml)
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison libpng-dev

      - uses: actions/cache@v4
        id: emsdk
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: emsdk
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/emscripten-core/emsdk ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build
        run: |
          . ~/emsdk/emsdk_env.sh
          scripts/build-core.sh ${{ matrix.core }} web

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.core }}-web
          path: dist/

  release:
    name: GitHub Release
    needs: [linux, windows, android]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release files
        run: scripts/make-release.sh artifacts release

      # One release per run; the publisher only looks at the latest.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cores-$(date -u +%Y%m%d)-${{ github.run_number }}"
          gh release create "$tag" release/* --repo "${{ github.repository }}" \
            --title "$tag" --latest \
            --notes "Cores built from ${{ github.sha }} by run ${{ github.run_id }}. manifest.cfg lists every file with its SHA-256."
